databases:
  - name: delivery-management-db
    plan: free
    databaseName: delivery_management_db
    user: delivery_admin

services:
  - name: delivery-management-api
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_HOST
        fromDatabase:
          name: delivery-management-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: delivery-management-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: delivery-management-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: delivery-management-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: delivery-management-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false