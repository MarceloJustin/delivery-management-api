spring.application.name=delivery-management-api

server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:local-dev-secret-key-never-use-this-in-production-ok}
jwt.expiration=${JWT_EXPIRATION:86400000}

refresh-token.expiration=${REFRESH_TOKEN_EXPIRATION:604800000}
refresh-token.cleanup.cron=${REFRESH_TOKEN_CLEANUP_CRON:0 0 3 * * *}

admin.name=${ADMIN_NAME:Admin}
admin.email=${ADMIN_EMAIL:admin@admin.com}
admin.password=${ADMIN_PASSWORD:Admin@123}